<meta name="theme-color" content="#f6f1e6">
<style>:root{
  --ink:#f6f1e6; --paper:#1f1a12; --mute:#7b7263; --line:rgba(90,66,20,.14);
  --card:rgba(255,253,248,.86); --card2:#fffdf8;
  --gold:#b0852a; --gold2:#d6ac4e; --gold3:#8a6619;
  --red:#b0852a; --danger:#b8402e; --green:#2f9466; --amber:#c98a1d; --vio:#d6ac4e;
  --r:18px; --sh:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.07);
  --F:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--paper);font-family:var(--F);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:radial-gradient(110% 70% at 85% 0%,#f3e3bd 0%,transparent 60%),radial-gradient(90% 60% at 0% 100%,#efe2c6 0%,transparent 60%),var(--ink)}
.app{position:relative;z-index:1;max-width:720px;margin:0 auto;min-height:100vh;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
header{padding:calc(12px + env(safe-area-inset-top)) 2px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo img{display:block;height:62px;width:auto}
.chip{max-width:48vw;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card2);white-space:nowrap;color:var(--paper)}
.chip.admin{border-color:rgba(176,133,42,.55);color:var(--gold3)}
.chip.expert{border-color:rgba(176,133,42,.55);color:#fff;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.banner{background:#fff7e3;border:1px solid rgba(176,133,42,.35);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;color:var(--gold3)}
.banner.warn{background:#fdeee9;border-color:rgba(184,64,46,.3);color:var(--danger)}
h2{font-family:var(--F);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:6px 2px 12px}
.sub-h{color:var(--mute);font-size:13px;margin:-6px 2px 14px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;box-shadow:var(--sh)}
.seg button{border:0;background:transparent;color:var(--mute);font:600 13px var(--F);padding:7px 13px;border-radius:99px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;box-shadow:var(--sh)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:8px}
.tag{color:var(--gold3);background:#f6ead0;padding:2px 9px;border-radius:99px;font-weight:700}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
.badge.pending{background:#fbefd6;color:var(--amber)}
.badge.no{background:#fbe5e0;color:var(--danger)}
.card h3{font-family:var(--F);font-weight:800;font-size:17px;line-height:1.3;margin-bottom:6px;word-wrap:break-word}
.card p.txt{color:#3d3527;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.card a.src{display:inline-block;margin-top:8px;color:var(--gold3);font-weight:600;font-size:13px;word-break:break-all}
.stamp{float:right;margin:-2px -2px 10px 14px;shape-outside:circle(50%);width:72px;height:72px;border-radius:50%;border:3px solid currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);font-family:var(--F);background:#fffdf8}
.stamp b{font-size:25px;line-height:1;font-weight:800}
.stamp i{font-style:normal;font-size:8px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;font-weight:700}
.stamp.none{color:#b9ae9a;border-style:dashed}
.split{clear:both;display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.split b{font-weight:800;color:var(--paper);font-size:15px;margin-right:3px}
.crit{clear:both;display:grid;grid-template-columns:1fr;gap:6px;margin-top:12px}
.crow{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.bar{height:6px;background:#efe6d3;border-radius:4px;overflow:hidden}
.bar>div{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold2),var(--gold3))}
.crow .v{font-weight:700;color:var(--paper);text-align:right}
.actions{clear:both;display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--paper);font:600 13px var(--F);padding:9px 14px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:rgba(176,133,42,.45)}
.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(176,133,42,.3)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.ok{border-color:rgba(47,148,102,.45);color:var(--green)}
.btn.danger{border-color:rgba(184,64,46,.35);color:var(--danger);background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.reviews{clear:both;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.rv{font-size:13px}
.rv .who{font-weight:700;font-size:12px;margin-bottom:2px;display:flex;gap:8px;align-items:center}
.rv .who .n{font-weight:800;color:var(--gold)}
.rv p{color:#3d3527;white-space:pre-wrap;word-wrap:break-word}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.empty b{display:block;color:var(--paper);font-size:16px;margin-bottom:6px;font-weight:800}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav .lbl{font-weight:800;font-size:15px;text-align:center}
.weeknav .lbl small{display:block;font-weight:500;font-size:12px;color:var(--mute);margin-top:2px}
.rk{display:grid;grid-template-columns:44px 1fr 64px;gap:12px;align-items:center}
.rk .pos{font-weight:900;font-size:24px;color:#c4b9a5;text-align:center}
.rk.p1 .pos{color:var(--gold)} .rk.p2 .pos{color:#9aa1ad} .rk.p3 .pos{color:#b8754a}
.rk h4{font-weight:700;font-size:14px;line-height:1.3;word-wrap:break-word}
.rk .m{font-size:12px;color:var(--mute);margin-top:3px}
.rk .sc{font-weight:900;font-size:26px;text-align:right}
.card.top{border-color:rgba(176,133,42,.4);background:linear-gradient(135deg,#fbf0d6,var(--card) 55%)}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
input[type=text],input[type=url],input[type=search],input[type=email],input[type=password],textarea,select{width:100%;background:#fffdf8;border:1px solid var(--line);border-radius:12px;color:var(--paper);font:500 16px var(--F);padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,133,42,.15)}
textarea{min-height:120px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold);margin-top:1px}
.check small{display:block;color:var(--mute);font-size:12px}
.cnt{font-size:11px;color:var(--mute);text-align:right;margin-top:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(246,241,230,.95) 35%)}
nav.tabs .in{display:flex;gap:4px;background:rgba(255,253,248,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:5px;max-width:540px;width:100%;box-shadow:0 8px 30px rgba(60,40,10,.12)}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:700 10.5px var(--F);padding:8px 2px;border-radius:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff}
nav.tabs .dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(31,26,18,.45)}
.sheet.hidden{display:none}
.sheet .box{background:#fffdf8;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sheet h3{font-weight:800;font-size:16px;line-height:1.3;margin-bottom:4px;padding-right:90px;word-wrap:break-word}
.total{position:absolute;right:18px;top:18px;font-weight:900;font-size:40px;line-height:1}
.total small{display:block;font-size:10px;text-align:right;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.sl{margin-top:16px}
.sl .t{display:flex;justify-content:space-between;align-items:baseline}
.sl .t b{font-size:14px}
.sl .t span{font-weight:800;font-size:17px;color:var(--gold3)}
.sl .d{font-size:12px;color:var(--mute);margin:1px 0 6px}
input[type=range]{width:100%;accent-color:var(--gold);height:28px}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.ulist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.urow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:#f8f1e1;border-radius:12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--paper);color:#fff8ea;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.av{flex:none;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-family:var(--F);font-weight:800;color:#1f1a12;overflow:hidden;vertical-align:middle}
.ulink{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left}
.ulink:hover span{text-decoration:underline}
.prof-top{display:flex;gap:16px;align-items:center}
.prof-top h2{margin:0 0 6px;word-break:break-word}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:#f8f1e1;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-weight:900;font-size:21px}
.stat span{font-size:11px;color:var(--mute)}
.bio{margin-top:14px;color:#3d3527;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.rrow{display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow h4{font-weight:700;font-size:14px;line-height:1.3;word-wrap:break-word}
.rrow p{font-size:13px;color:var(--mute);margin-top:2px;white-space:pre-wrap;word-wrap:break-word}
.rrow .n{font-weight:900;font-size:19px;text-align:right}
.avedit{display:flex;gap:16px;align-items:center;margin-top:10px}
.avedit .btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--paper);box-shadow:0 0 0 2px #fff inset}
.legend{font-size:12px;color:var(--mute);margin:4px 2px 14px;line-height:1.5}
.login-logo{display:block;width:min(300px,78%);margin:8px auto 4px}
/* media */
.mgrid{clear:both;display:grid;gap:6px;margin-top:12px;border-radius:14px;overflow:hidden}
.mgrid.n1{grid-template-columns:1fr}
.mgrid.n2,.mgrid.n4{grid-template-columns:1fr 1fr}
.mgrid.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.mgrid.n3 .mt:first-child{grid-row:span 2}
.mt{position:relative;border:0;padding:0;background:#e9dfca;cursor:pointer;overflow:hidden;aspect-ratio:1/1;display:block;width:100%}
.mgrid.n1 .mt{aspect-ratio:auto;max-height:420px}
.mgrid.n1 .mt img{max-height:420px}
.mgrid.n3 .mt:first-child{aspect-ratio:auto}
.mt img{width:100%;height:100%;object-fit:cover;display:block}
.mt .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mt .play i{width:54px;height:54px;border-radius:50%;background:rgba(31,26,18,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.mt .play i:after{content:"";margin-left:5px;border-left:17px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
.mt .dur{position:absolute;right:8px;bottom:8px;background:rgba(31,26,18,.65);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.srcbox{clear:both;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.srcbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(176,133,42,.4);background:#fbf3e0;color:var(--gold3);font:700 13px var(--F);padding:8px 12px;border-radius:12px;cursor:pointer}
.srcbtn i{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.srclink{font-size:12px;color:var(--mute);word-break:break-all}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.pick .it{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#e9dfca}
.pick .it img{width:100%;height:100%;object-fit:cover}
.pick .it .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(31,26,18,.7);color:#fff;font-size:15px;line-height:24px;cursor:pointer}
.pick .it .k{position:absolute;left:4px;bottom:4px;background:rgba(31,26,18,.7);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px}
.pick .add{aspect-ratio:1/1;border-radius:12px;border:2px dashed rgba(176,133,42,.45);background:#fbf3e0;color:var(--gold3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 12px var(--F);cursor:pointer;text-align:center}
.pick .add b{font-size:24px;line-height:1}
/* viewer */
.viewer{position:fixed;inset:0;z-index:40;background:#0f0c08;display:flex;flex-direction:column}
.viewer.hidden{display:none}
.viewer .top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#f3e7cc;gap:10px}
.viewer .top span{font-size:13px;font-weight:600;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vx{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
.viewer .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:0 0 calc(10px + env(safe-area-inset-bottom))}
.viewer .stage img,.viewer .stage video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.viewer .stage iframe{width:100%;max-width:960px;height:100%;max-height:100%;border:0;background:#000}
.viewer .stage iframe.ratio{height:auto;aspect-ratio:16/9}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;cursor:pointer}
.viewer .nav.l{left:10px}.viewer .nav.r{right:10px}
.viewer .prog{color:#f3e7cc;text-align:center;font-weight:600}
.viewer .prog .pb{width:220px;height:6px;background:rgba(255,255,255,.15);border-radius:4px;margin:10px auto 0;overflow:hidden}
.viewer .prog .pb div{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0}
.viewer .ext{color:#d6ac4e;font-size:13px;font-weight:600;text-decoration:none}

/* роли */
.chip.gossip{border-color:transparent;color:#1d3550;background:linear-gradient(120deg,#e9fbff,#b9e9ff 30%,#f6e8ff 55%,#c7f3ff 80%,#ffffff);background-size:200% 100%;animation:shimmer 4s linear infinite;box-shadow:0 0 0 1px rgba(120,190,230,.55)}
@keyframes shimmer{to{background-position:-200% 0}}
.ring{display:inline-flex;border-radius:50%;padding:3px;flex:none}
.ring.gold{background:linear-gradient(135deg,var(--gold2),var(--gold3))}
.ring.dia{padding:2.5px;background:conic-gradient(from 0deg,#bff3ff,#ffffff,#9ad7ff,#f3dcff,#ffffff,#a6f0ff,#d8c8ff,#bff3ff);animation:spin 6s linear infinite;box-shadow:0 0 8px rgba(140,210,255,.7)}
.ring.dia>*{animation:spin 6s linear infinite reverse}
.ring>.av{box-shadow:0 0 0 1.5px #fffdf8}
.urow .btn{white-space:nowrap}
.urow{flex-wrap:wrap}
.urow .ulink{min-width:0;flex:1 1 auto}
.rbtns{display:flex;gap:6px;margin-left:auto}
.rbtns .btn{padding:7px 10px;font-size:12.5px;justify-content:center}
@media (max-width:560px){.rbtns{width:100%}.rbtns .btn{flex:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring.dia,.ring.dia>*,.chip.gossip{animation:none}}
.prog-card .pgh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.pg{margin-top:8px}.pgt{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:4px}.pgt b{color:var(--paper)}
/* список чатов */
.chatrow{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:10px;border-radius:14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.chatrow:hover{background:#f8f1e1}
.cav{flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#1f1a12;font-weight:800;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.cr-mid{flex:1;min-width:0;display:flex;flex-direction:column}
.cr-mid b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-mid span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11px;color:var(--mute)}
.udot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));display:block}
.pickrow{display:flex;gap:10px;align-items:center;padding:8px 10px;background:#f8f1e1;border-radius:12px;cursor:pointer;font-size:14px}
.pickrow input{width:20px;height:20px;accent-color:var(--gold)}
/* комната */
body.inchat nav.tabs{display:none}
body.inchat .app{padding-bottom:0}
body.inchat header{display:none}
#chatRoom{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.chead{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 4px 8px;margin:0 -14px;padding-left:10px;padding-right:10px;background:rgba(255,253,248,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.cinfo{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:inherit;font:inherit;text-align:left;min-width:0;flex:1}
.cinfo span{display:flex;flex-direction:column;min-width:0}
.cinfo b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cinfo small{font-size:12px;color:var(--mute)}
.cbtn{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--gold3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cbtn svg{width:24px;height:24px}
.cbtn.send{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;box-shadow:0 4px 12px rgba(176,133,42,.35)}
.cbtn.send svg{width:21px;height:21px}
.msgs{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 0 8px}
.daysep{text-align:center;margin:12px 0 8px}
.daysep span{display:inline-block;font-size:11px;font-weight:700;color:var(--gold3);background:rgba(246,234,208,.9);padding:4px 10px;border-radius:99px}
.sysmsg{text-align:center;font-size:12px;color:var(--mute);margin:6px 0}
.msg{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.msg.first{margin-top:8px}
.msg.me{justify-content:flex-end}
.mav{width:32px;flex:none}
.bub{position:relative;max-width:min(78%,480px);background:#fffdf8;border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:8px 12px 18px;box-shadow:0 1px 2px rgba(60,40,10,.06);word-wrap:break-word;overflow-wrap:anywhere}
.msg:not(.first) .bub{border-radius:18px 18px 18px 6px}
.msg.me .bub{background:linear-gradient(135deg,#e2bd63,var(--gold));color:#fff;border-color:transparent;border-radius:18px 18px 6px 18px;cursor:pointer}
.msg.me .bub a{color:#fff}
.bub .txt{white-space:pre-wrap;font-size:15px;line-height:1.4}
.bub .txt a{color:var(--gold3);text-decoration:underline}
.mname{font-size:12px;font-weight:700;color:var(--gold3);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.mtime{position:absolute;right:10px;bottom:4px;font-size:10px;opacity:.6}
.bub.media{padding:4px;overflow:hidden}
.bub.media .mtime{color:#fff;background:rgba(31,26,18,.5);padding:1px 6px;border-radius:8px;opacity:1;right:10px;bottom:9px}
.mimg{display:block;border:0;padding:0;background:#e9dfca;border-radius:14px;overflow:hidden;cursor:zoom-in;width:min(260px,62vw);max-height:340px}
.mimg img{width:100%;height:100%;object-fit:cover;display:block}
.bub.sticker{background:none!important;border:0;box-shadow:none;padding:2px 2px 16px}
.bub.sticker .mtime{color:var(--mute);position:static;display:block;text-align:right;margin-top:2px}
.bub.sticker{padding-bottom:2px}
.stk-e{font-size:78px;line-height:1;display:block}
.stk-e.sm{font-size:40px}
.stk-s{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:140px;max-width:180px;padding:12px 16px;border:4px double var(--c);color:var(--c);border-radius:16px;transform:rotate(-7deg);background:rgba(255,253,248,.85);font-weight:900;font-size:19px;line-height:1.05;text-align:center;letter-spacing:.02em;text-transform:uppercase;box-shadow:0 6px 16px rgba(60,40,10,.12)}
.stk-s img{width:30px;height:30px;opacity:.85}
.stk-s.sm{min-width:0;max-width:100%;width:100%;padding:6px 3px;font-size:9.5px;border-width:3px;border-radius:10px;transform:rotate(-5deg);gap:2px;box-shadow:none}
.stk-s.sm img{width:16px;height:16px}
.voice{display:flex;align-items:center;gap:8px;min-width:200px;--p:0%}
.vplay{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;cursor:pointer}
.msg.me .vplay{background:#fff}
.vplay i{margin-left:3px;border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.msg.me .vplay i{border-left-color:var(--gold)}
.voice.playing .vplay i{margin:0;border:0;width:12px;height:14px;border-left:4px solid #fff;border-right:4px solid #fff}
.msg.me .voice.playing .vplay i{border-left-color:var(--gold);border-right-color:var(--gold)}
.voice.loading .vplay{opacity:.6}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:30px}
.wave i{flex:1;min-width:2px;border-radius:2px;background:rgba(138,102,25,.3)}
.wave i.on{background:var(--gold3)}
.msg.me .wave i{background:rgba(255,255,255,.45)}
.msg.me .wave i.on{background:#fff}
.vdur{font-size:12px;font-weight:600;opacity:.75;min-width:30px}
.fwd{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;background:rgba(246,234,208,.7);border-left:3px solid var(--gold);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--paper);font:inherit;width:min(260px,62vw)}
.msg.me .fwd{background:rgba(255,255,255,.92)}
.fwd .fh{display:flex;gap:4px;align-items:center;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--gold3)}
.fwd .fh svg{width:13px;height:13px}
.fwd img{width:100%;max-height:150px;object-fit:cover;border-radius:8px}
.fwd b{font-size:14px;line-height:1.3}
.fwd .fsc{font-size:12px;font-weight:800;color:var(--mute)}
.bub.fwdw{padding:6px 6px 18px}
.bub.fwdw .txt{padding:6px 6px 0}
.composer{position:sticky;bottom:0;z-index:4;margin:0 -14px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,253,248,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.crow2{display:flex;align-items:flex-end;gap:4px}
.crow2 textarea{flex:1;min-height:42px;max-height:140px;resize:none;border-radius:22px;padding:10px 14px;line-height:1.35}
.crow2.hidden,.recbar.hidden,.stkpanel.hidden{display:none}
.stkpanel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-height:230px;overflow:auto;padding:4px 2px 10px}
.stkbtn{border:0;background:#f8f1e1;border-radius:12px;padding:8px 6px;overflow:hidden;min-width:0;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:56px}
.recbar{display:flex;align-items:center;gap:10px;min-height:42px}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
#recTime{font-weight:800;min-width:38px}
.recwave{flex:1;display:flex;align-items:center;gap:2px;height:30px;overflow:hidden}
.recwave i{flex:1;max-width:5px;min-width:2px;background:var(--gold);border-radius:2px}

.sheet{top:var(--vvt,0);bottom:auto;height:var(--vvh,100vh)}
.sheet .box{max-height:calc(var(--vvh,100vh) - 16px)}
html.inchat,body.inchat{overflow:hidden;height:100%;overscroll-behavior:none}
body.inchat #chatRoom{position:fixed;left:0;right:0;top:var(--vvt,0);height:var(--vvh,100vh);min-height:0;max-width:720px;margin:0 auto;z-index:6;display:flex;flex-direction:column}
body.inchat .chead{position:static;margin:0;flex:none;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
body.inchat .msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 8px}
body.inchat .composer{position:static;margin:0;flex:none}
.msgerr{text-align:center;color:var(--mute);padding:30px 16px}
.msgerr b{display:block;color:var(--paper);margin-bottom:8px}

.stk-s{min-width:150px;max-width:190px;padding:12px 14px 14px;gap:6px;line-height:1.08}
.stk-s img{width:40px;height:40px;opacity:1;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
.stk-s b{display:block;white-space:nowrap}
.stkbtn{overflow:visible;padding:10px 6px;min-height:78px}
.stk-s.sm{transform:rotate(-4deg);width:100%;min-width:0;max-width:100%;padding:6px 3px 7px;gap:3px;border-width:3px;border-radius:10px}
.stk-s.sm img{width:22px;height:22px}

/* рейтинг */
.rhero{background:linear-gradient(160deg,#fff8e6,#fbefd3 60%,#f6e3b7);border:1px solid rgba(176,133,42,.28);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.rh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.rh-top h2{margin:0}
.rseg button{padding:6px 11px;font-size:12px}
.rhero .weeknav{margin-bottom:12px}
.rhero .weeknav .btn{width:40px;height:40px;justify-content:center;padding:0;font-size:18px;border-radius:50%}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2f9466;margin-right:6px;vertical-align:1px;animation:pulse 1.4s ease-in-out infinite}
.wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wstats div{background:rgba(255,253,248,.75);border-radius:12px;padding:8px 4px;text-align:center}
.wstats b{display:block;font-size:19px;font-weight:900}
.wstats span{font-size:10.5px;color:var(--mute)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:20px 0 14px}
.pod{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:inherit;font:inherit;position:relative;min-width:0}
.pod .crown{font-size:26px;line-height:1;margin-bottom:-6px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.pod-av{position:relative;display:inline-flex}
.pod .rthumb{border:3px solid var(--m);box-shadow:0 6px 16px rgba(60,40,10,.18)}
.medal{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--m);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fffdf8}
.pod-t{font-size:12px;font-weight:700;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px;padding:0 2px;margin-top:4px}
.pod-col{width:100%;border-radius:14px 14px 6px 6px;background:linear-gradient(180deg,color-mix(in srgb,var(--m) 85%,#fff),var(--m));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 6px 18px rgba(60,40,10,.15)}
.pod-col b{font-size:30px;font-weight:900;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.pod-col small{font-size:10px;opacity:.9;margin-top:3px}
.pod.p1 .pod-col{height:120px}.pod.p2 .pod-col{height:92px}.pod.p3 .pod-col{height:72px}
.pod.p1 .pod-col b{font-size:36px}
.rthumb{flex:none;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:#f3e6c8}
.rthumb img{width:100%;height:100%;object-fit:cover}
.rthumb.noimg{background:linear-gradient(135deg,#fbefd3,#ecd7a6)}
.winner{cursor:pointer;overflow:hidden;padding:0;border-color:rgba(176,133,42,.4)}
.w-cover{height:150px;background-size:cover;background-position:center;position:relative}
.w-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(255,253,248,.95))}
.w-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;gap:8px}
.w-badge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--gold2),var(--gold3));padding:5px 10px;border-radius:99px}
.w-title{font-size:19px!important;padding:8px 16px 0;margin:0!important}
.w-body{display:flex;align-items:center;justify-content:space-around;gap:4px;padding:6px 6px 0;flex-wrap:wrap}
.ring-n{font:900 30px var(--F);fill:var(--paper)}
.ring-l{font:600 10px var(--F);fill:var(--mute)}
.radar-l{font:700 9.5px var(--F);fill:var(--mute)}
.radar-v{font:800 10px var(--F);fill:var(--gold3)}
.w-split{display:flex;gap:16px;justify-content:center;padding:4px 16px 16px;font-size:12px;color:var(--mute)}
.w-split b{font-size:15px;color:var(--paper)}
.sec{font-size:15px;font-weight:800;margin:20px 2px 10px;letter-spacing:-.01em}
.rlist{padding:6px}
.rrank{display:grid;grid-template-columns:28px 46px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:8px;border-radius:14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.rrank:hover,.fw:hover,.cl:hover{background:#f8f1e1}
.rr-pos{font-weight:900;font-size:16px;color:#b9ae9a;text-align:center}
.rr-mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.rr-mid b{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rr-mid>span{font-size:11.5px;color:var(--mute)}
.rr-bar{display:block;height:4px;border-radius:3px;background:#efe6d3;overflow:hidden;margin-top:3px}
.rr-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold2),var(--gold3))}
.rr-sc{font-weight:900;font-size:22px;min-width:36px;text-align:right}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:2px 14px 8px;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.cl{flex:none;width:170px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:inherit;font:inherit;box-shadow:var(--sh)}
.cl-l{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold3)}
.cl b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.cl-v{font-size:24px;font-weight:900}
.cl-v small{font-size:12px;color:var(--mute);font-weight:600}
.judges{padding:10px 12px}
.jrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.jrow:first-child{border-top:0}
.jpos{width:22px;text-align:center;font-weight:900;color:#b9ae9a}
.jcrown{width:22px;text-align:center;font-size:18px}
.jrow .ulink{flex:1;min-width:0}
.jst{font-size:12px;color:var(--mute);white-space:nowrap}
.jst b{color:var(--paper);font-size:14px}
.jfun{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mute)}
.jfun b{color:var(--paper)}
.fame{display:flex;flex-direction:column;gap:8px}
.fw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:inherit;font:inherit;box-shadow:var(--sh)}
.fw-w{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold3)}
.fw-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}

.hright{display:flex;align-items:center;gap:8px}
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--gold3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh)}
.bell svg{width:21px;height:21px}
.bell .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;line-height:18px;text-align:center;padding:0 4px;border:2px solid var(--ink)}
.ntlist{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto;margin:6px -6px 0;padding:0 6px}
.nt{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:0;border-radius:14px;padding:10px 8px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.nt.unread{background:#fbf0d6}
.nt:hover{background:#f8f1e1}
.nt-ic{position:relative;flex:none}
.nt-ic>i{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:13px;background:#fffdf8;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.nt-e{width:36px;height:36px;border-radius:50%;background:#f3e6c8;display:flex;align-items:center;justify-content:center;font-size:18px}
.nt-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nt-mid b{font-size:14px;line-height:1.3}
.nt-mid span{font-size:13px;color:#4a4232;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nt-mid small{font-size:11px;color:var(--mute)}
.npush{margin-top:10px}
.np-h{display:flex;gap:12px;align-items:center}
.np-ic{font-size:26px}
.np-h b{display:block}
.np-h small{color:var(--mute)}
.np-h .ok{color:var(--green);font-weight:700}
.np-steps{margin:12px 0 4px 18px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.np-steps a{color:var(--gold3);font-weight:700}
.np-topic{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.np-topic code{background:#f3e6c8;padding:6px 10px;border-radius:8px;font-size:13px;word-break:break-all;user-select:all}
</style>

function errText(e){

    'auth/invalid-credential':'Неверная почта или пароль.',
    'auth/wrong-password':'Неверная почта или пароль.',
    'auth/user-not-found':'Такого пользователя нет.',
    'auth/email-already-in-use':'Эта почта уже зарегистрирована — войдите.',

    'auth/operation-not-allowed':'Этот способ входа не включён в Firebase → Authentication.',

  };
  return m[c]||('Ошибка: '+(c||'неизвестная'));

  unsubs.push(onSnapshot(query(collection(db,'posts'),where('status','==','ok')),s=>{S.okPosts=mapSnap(s);S.loaded.posts=true;scheduleAutoPromote();render();},onErr));

/* ---------- данные ---------- */
function allPosts(){
  const merged={...S.myPosts,...S.okPosts,...S.adminPosts};
  const out=[];
  for(const[id,it]of Object.entries(merged)){
    if(!it||typeof it.title!=='string')continue;
    const status=['ok','no','pending'].includes(it.status)?it.status:'pending';
    out.push({id,title:it.title.slice(0,160),text:String(it.text||'').slice(0,2000),link:it.link,tag:String(it.tag||'Другое').slice(0,30),
      anon:!!it.anon,by:it.by||null,author:S.authors[id]||it.by||(S.myIds.has(id)?S.me.id:null),
      createdAt:+it.createdAt||0,status,pubAt:+it.pubAt||+it.createdAt||0,media:Array.isArray(it.media)?it.media.filter(m=>m&&typeof m.id==='string').slice(0,4):[]});
  }
  return out;
}
function scoreOf(p){
  const E=[],P=[],crit=[0,0,0,0,0];let n=0,mine=null;const reviews=[];
  for(const r of Object.values(S.ratings)){
    if(!r||r.pid!==p.id||!Array.isArray(r.s)||r.s.length!==5||(p.author&&r.uid===p.author))continue;
    const s=r.s.map(v=>Math.max(0,Math.min(MAX,Math.round(+v||0))));
    const tot=s.reduce((a,b)=>a+b,0);
    const exp=isExp(r.uid);
    if(r.uid===S.me.id)mine={s,note:String(r.note||''),tot};
    (exp?E:P).push(tot);s.forEach((v,i)=>crit[i]+=v);n++;
    const note=String(r.note||'').trim();
    if(note)reviews.push({u:r.uid,note:note.slice(0,1500),tot,exp,at:+r.at||0});
  }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const e=avg(E),pp=avg(P);
  const fin=e!=null&&pp!=null?W_EXP*e+(1-W_EXP)*pp:(e!=null?e:pp);
  reviews.sort((a,b)=>(b.exp-a.exp)||(b.at-a.at));
  return {e,p:pp,ne:E.length,np:P.length,n,fin:fin==null?null:Math.round(fin),crit:n?crit.map(c=>c/n):null,reviews,mine};
}

function card(p,sc,extra){
  const link=safeUrl(p.link);
  const own=S.myIds.has(p.id)||p.by===S.me.id;
  const canRate=p.status==='ok'&&!own;
  const open=S.open.has(p.id);
  let acts='';
  if(canRate)acts+=`<button class="btn ${sc.mine?'':'primary'}" data-act="rate" data-id="${esc(p.id)}">${sc.mine?`Ваша оценка: ${sc.mine.tot} · изменить`:'Оценить'}</button>`;
  if(own&&p.status==='ok')acts+=`<span class="legend" style="margin:0;align-self:center">Свой завоз оценивать нельзя</span>`;
  if(p.status==='ok'&&canChat())acts+=`<button class="btn ghost" data-act="share" data-id="${esc(p.id)}">${IC.share.replace('<svg','<svg width="15" height="15"')} В чат</button>`;
  if(sc.reviews.length)acts+=`<button class="btn ghost" data-act="rev" data-id="${esc(p.id)}">${open?'Скрыть':'Рецензии'} (${sc.reviews.length})</button>`;
  if(S.me.admin&&p.status==='ok')acts+=`<button class="btn danger" data-act="unpub" data-id="${esc(p.id)}">Снять</button>`;
  if(own&&p.status!=='ok')acts+=`<button class="btn danger" data-act="del" data-id="${esc(p.id)}">Удалить</button>`;
  if(extra)acts+=extra;

  return `<article class="card">
    ${p.status==='ok'?stamp(sc.fin):''}
    <div class="meta"><span class="tag">#${esc(p.tag)}</span><span>${fDT.format(p.pubAt||p.createdAt)}</span><span>${authorHtml(p)}</span>${st}</div>
    <h3>${esc(p.title)}</h3>
    ${p.text?`<p class="txt">${esc(p.text)}</p>`:''}
    ${mediaGrid(p)}

    ${p.status==='ok'&&sc.n?`<div class="split"><span><b style="color:var(--gold)">${fmt1(sc.e)}</b>знатоки · ${sc.ne}</span><span><b>${fmt1(sc.p)}</b>народ · ${sc.np}</span></div>${critHtml(sc.crit)}`:''}

function ringSvg(v,size){
  const r=size/2-6,c=2*Math.PI*r,f=Math.max(0,Math.min(100,v||0))/100;
  return `<svg class="ring-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs><linearGradient id="rg${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c56a"/><stop offset="1" stop-color="#8a6619"/></linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#efe4cc" stroke-width="8"/>

    <text x="50%" y="47%" text-anchor="middle" dominant-baseline="middle" class="ring-n">${v==null?'—':v}</text>
    <text x="50%" y="70%" text-anchor="middle" class="ring-l">из 100</text></svg>`;
}
function radarSvg(crit,size){
  const cx=size/2,cy=size/2+4,R=size/2-30,N=5;
  const pt=(i,k)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*R*k,cy+Math.sin(a)*R*k];};
  const poly=k=>Array.from({length:N},(_,i)=>pt(i,k).map(v=>v.toFixed(1)).join(',')).join(' ');
  const vals=(crit||[0,0,0,0,0]).map(v=>Math.max(.04,Math.min(1,v/MAX)));
  const shape=vals.map((k,i)=>pt(i,k).map(v=>v.toFixed(1)).join(',')).join(' ');
  return `<svg class="radar" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${[.25,.5,.75,1].map(k=>`<polygon points="${poly(k)}" fill="none" stroke="#e6d8b8" stroke-width="1"/>`).join('')}
    ${Array.from({length:N},(_,i)=>{const [x,y]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e6d8b8" stroke-width="1"/>`;}).join('')}
    <polygon points="${shape}" fill="rgba(214,172,78,.35)" stroke="#b0852a" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((k,i)=>{const [x,y]=pt(i,k);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#8a6619"/>`;}).join('')}
    ${Array.from({length:N},(_,i)=>{const [x,y]=pt(i,1.24);return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" class="radar-l">${CRIT_SHORT[i]}</text><text x="${x.toFixed(1)}" y="${(y+15).toFixed(1)}" text-anchor="middle" class="radar-v">${crit?crit[i].toFixed(1):'—'}</text>`;}).join('')}
  </svg>`;
}
function leftStr(ms){
  if(ms<=0)return 'подводим итоги';
  const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/3600e3),m=Math.floor(ms%3600e3/60e3);
  return d?`${d} ${plural(d,'день','дня','дней')} ${h} ч`:h?`${h} ч ${m} мин`:`${m} мин`;
}

async function fileToAvatar(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s=Math.min(img.naturalWidth,img.naturalHeight);
    const c=document.createElement('canvas');c.width=c.height=256;
    c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,256,256);
    let q=.85,d=c.toDataURL('image/jpeg',q);
    while(d.length>110000&&q>.35){q-=.1;d=c.toDataURL('image/jpeg',q);}
    return d;
  }finally{URL.revokeObjectURL(url);}
}

/* ---------- медиа: загрузка, превью, просмотр ---------- */
const MAX_FILES=4, MAX_VID_MB=25, CHUNK=950000;
const pad3=i=>String(i).padStart(3,'0');
const fmtDur=s=>{s=Math.round(+s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function okThumb(t){return typeof t==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(t);}
function pickHtml(){
  const f=S.draft.files||[];
  return f.map((x,i)=>`<div class="it">${x.th?`<img src="${x.th}" alt="">`:''}${x.t==='vid'?`<span class="k">▶ ${fmtDur(x.dur)}</span>`:''}<button type="button" class="x" data-rm="${i}" aria-label="Убрать">×</button></div>`).join('')
    +(f.length<MAX_FILES?`<label class="add" for="fMedia"><b>+</b>Фото<br>или видео</label>`:'');
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function drawTo(src,sw,sh,max){
  const k=Math.min(1,max/Math.max(sw,sh));const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c;
}
const canvasBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function prepImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);
    const w=img.naturalWidth,h=img.naturalHeight;
    const big=drawTo(img,w,h,1600);let q=.85,blob=await canvasBlob(big,q);
    while(blob&&blob.size>CHUNK&&q>.4){q-=.1;blob=await canvasBlob(big,q);}
    if(!blob)throw new Error('img');
    const th=drawTo(img,w,h,520).toDataURL('image/jpeg',.68);
    return {t:'img',blob,mime:'image/jpeg',th,w:big.width,h:big.height,dur:0};
  }finally{URL.revokeObjectURL(url);}
}
function prepVideo(file){
  return new Promise((resolve,reject)=>{
    if(file.size>MAX_VID_MB*1048576){reject(new Error('big'));return;}
    const url=URL.createObjectURL(file);const v=document.createElement('video');
    v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';v.src=url;
    let done=false;
    const finish=(th)=>{if(done)return;done=true;const out={t:'vid',blob:file,mime:file.type||'video/mp4',th:th||'',w:v.videoWidth||0,h:v.videoHeight||0,dur:isFinite(v.duration)?v.duration:0};URL.revokeObjectURL(url);resolve(out);};
    const grab=()=>{try{if(!v.videoWidth)return finish('');finish(drawTo(v,v.videoWidth,v.videoHeight,520).toDataURL('image/jpeg',.68));}catch(e){finish('');}};
    v.addEventListener('loadeddata',()=>{try{v.currentTime=Math.min(0.5,(v.duration||1)/3);}catch(e){grab();}},{once:true});
    v.addEventListener('seeked',grab,{once:true});
    v.addEventListener('error',()=>{if(!done){done=true;URL.revokeObjectURL(url);reject(new Error('video'));}},{once:true});
    setTimeout(()=>{if(!done)grab();},6000);
  });
}
async function addFiles(list){
  for(const f of [...list]){
    if(S.draft.files.length>=MAX_FILES){toast('Не больше '+MAX_FILES+' файлов');break;}
    try{
      if(f.type.startsWith('video/'))S.draft.files.push(await prepVideo(f));
      else if(f.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name))S.draft.files.push(await prepImage(f));
      else toast('Этот тип файла не поддерживается');
    }catch(e){toast(e&&e.message==='big'?`Видео больше ${MAX_VID_MB} МБ — обрежьте его в «Фото» и попробуйте снова`:'Не удалось открыть файл');}
    const pk=$('#pick');if(pk)pk.innerHTML=pickHtml();
  }
}
async function uploadAll(files,progress){
  const out=[];
  if(!files||!files.length)return out;
  const total=files.reduce((a,f)=>a+Math.max(1,Math.ceil(f.blob.size/CHUNK)),0);let sent=0;
  for(const f of files){
    const bytes=new Uint8Array(await f.blob.arrayBuffer());
    const n=Math.max(1,Math.ceil(bytes.length/CHUNK));
    const mref=doc(collection(db,'media'));
    const bt=writeBatch(db);
    bt.set(mref,{type:f.t,mime:String(f.mime).slice(0,60),size:bytes.length,n,createdAt:Date.now()});
    bt.set(doc(db,'mediaOwners',mref.id),{uid:S.me.id});
    await bt.commit();
    for(let i=0;i<n;i++){
      progress(`Загрузка ${Math.round(sent/total*100)}%`);
      await setDoc(doc(db,'media',mref.id,'c',pad3(i)),{d:Bytes.fromUint8Array(bytes.subarray(i*CHUNK,(i+1)*CHUNK))});
      sent++;
    }
    out.push({id:mref.id,t:f.t,th:f.th||'',w:f.w|0,h:f.h|0,n,mime:String(f.mime).slice(0,60),dur:Math.round(f.dur||0)});
  }
  progress('Загрузка 100%');
  return out;
}
const blobCache=new Map();
async function fetchMedia(m,onProg){
  if(blobCache.has(m.id))return blobCache.get(m.id);
  const n=Math.max(1,Math.min(40,m.n|0));const parts=new Array(n);let got=0,next=0;
  const worker=async()=>{while(next<n){const i=next++;const s=await getDoc(doc(db,'media',m.id,'c',pad3(i)));if(!s.exists())throw new Error('missing');parts[i]=s.data().d.toUint8Array();got++;onProg&&onProg(got/n);}};
  await Promise.all([worker(),worker(),worker()]);
  const url=URL.createObjectURL(new Blob(parts,{type:m.mime||(m.t==='vid'?'video/mp4':'image/jpeg')}));
  blobCache.set(m.id,url);return url;
}
function mediaGrid(p){
  const ms=p.media||[];if(!ms.length)return '';
  return `<div class="mgrid n${ms.length}">${ms.map((m,i)=>`<button class="mt" data-act="media" data-id="${esc(p.id)}" data-i="${i}" aria-label="${m.t==='vid'?'Видео':'Фото'}">${okThumb(m.th)?`<img src="${m.th}" alt="" loading="lazy">`:''}${m.t==='vid'?`<span class="play"><i></i></span>${m.dur?`<span class="dur">${fmtDur(m.dur)}</span>`:''}`:''}</button>`).join('')}</div>`;
}

/* ---------- плеер источников ---------- */
function parseEmbed(u){
  let x;try{x=new URL(u);}catch(e){return null;}
  const host=x.hostname.replace(/^(www\.|m\.)/,'');const path=x.pathname;let m;
  if(/\.(jpe?g|png|gif|webp)$/i.test(path))return {k:'img',src:x.href};
  if(/\.(mp4|webm|mov|m4v)$/i.test(path))return {k:'video',src:x.href};
  if(host==='youtu.be'&&(m=path.match(/^\/([\w-]{6,})/)))return {k:'frame',src:`https://www.youtube.com/embed/${m[1]}?autoplay=1&playsinline=1`,name:'YouTube'};
  if(/(^|\.)youtube\.com$/.test(host)){
    const id=x.searchParams.get('v')||((m=path.match(/^\/(?:shorts|embed|live)\/([\w-]{6,})/))&&m[1]);
    if(id&&/^[\w-]{6,}$/.test(id))return {k:'frame',src:`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1`,name:'YouTube'};
  }
  if(host==='rutube.ru'&&(m=path.match(/^\/(?:video|shorts|play\/embed)\/([0-9a-f]{20,})/i)))return {k:'frame',src:`https://rutube.ru/play/embed/${m[1]}`,name:'Rutube'};
  if(/^(vk\.com|vk\.ru|vkvideo\.ru)$/.test(host)){
    const z=(x.searchParams.get('z')||'')+' '+path;
    if((m=z.match(/(?:video|clip)(-?\d+)_(\d+)/)))return {k:'frame',src:`https://vkvideo.ru/video_ext.php?oid=${m[1]}&id=${m[2]}&hd=2&autoplay=1`,name:'VK Видео'};
  }

const REVIEW_MIN=20;                         // рецензия = комментарий от 20 символов
const NEED_EXP={posts:10,rates:10}, NEED_GOS={posts:50,revs:50};
const roleOf=id=>S.roles[id]||{};
const isExp=id=>{const r=roleOf(id);return r.expert===true||r.gossip===true;};
const isGossip=id=>roleOf(id).gossip===true;
const canChat=()=>!!S.me.id&&(S.me.admin||isExp(S.me.id));
function ringWrap(id,html){return isGossip(id)?`<span class="ring dia">${html}</span>`:isExp(id)?`<span class="ring gold">${html}</span>`:html;}
function roleChip(id,small){
  const st=small?' style="padding:2px 7px;font-size:10px"':'';
  return isGossip(id)?`<span class="chip gossip"${st}>сплетник</span>`:isExp(id)?`<span class="chip expert"${st}>знаток</span>`:'';
}
function countsFor(uid,authorOf){
  const ok=allPosts().filter(p=>p.status==='ok');const okIds=new Set(ok.map(p=>p.id));
  const posts=ok.filter(p=>authorOf(p)===uid).length;
  let rates=0,revs=0;
  for(const r of Object.values(S.ratings)){if(!r||r.uid!==uid||!okIds.has(r.pid))continue;rates++;if(String(r.note||'').trim().length>=REVIEW_MIN)revs++;}
  return {posts,rates,revs};
}
let apT=null,apBusy=false;
function scheduleAutoPromote(){if(!S.me.admin)return;clearTimeout(apT);apT=setTimeout(autoPromote,2500);}
async function autoPromote(){
  if(!S.me.admin||apBusy||!S.loaded.posts||!S.loaded.ratings||!S.authorsLoaded)return;
  apBusy=true;
  try{
    const ok=allPosts().filter(p=>p.status==='ok');const okIds=new Set(ok.map(p=>p.id));
    const pc={},rc={},vc={};
    ok.forEach(p=>{const a=S.authors[p.id]||p.by;if(a)pc[a]=(pc[a]||0)+1;});
    Object.values(S.ratings).forEach(r=>{if(!r||!okIds.has(r.pid))return;rc[r.uid]=(rc[r.uid]||0)+1;if(String(r.note||'').trim().length>=REVIEW_MIN)vc[r.uid]=(vc[r.uid]||0)+1;});
    for(const uid of Object.keys(S.names)){
      const r=S.roles[uid]||{};if(r.noAuto===true)continue;
      const g=r.gossip===true||((pc[uid]||0)>=NEED_GOS.posts&&(vc[uid]||0)>=NEED_GOS.revs);
      const e=r.expert===true||g||((pc[uid]||0)>=NEED_EXP.posts&&(rc[uid]||0)>=NEED_EXP.rates);
      if(g!==(r.gossip===true)||e!==(r.expert===true)){
        await setDoc(doc(db,'roles',uid),{admin:r.admin===true,expert:e,gossip:g,noAuto:false});
        notify([uid],'role',g&&r.gossip!==true?'💎 Вы теперь сплетник!':'🎉 Вы теперь знаток!',g&&r.gossip!==true?'Алмазная рамка и высший статус Комитета':'Открыты чаты знатоков, а ваши оценки весят больше',{tab:'profile'});
        toast(`${realName(uid)} теперь ${g?'сплетник 💎':'знаток'}`);
      }
    }
  }catch(e){console.error(e);}finally{apBusy=false;}
}
function setRole(id,patch,msg){
  const r=S.roles[id]||{};
  const next={admin:r.admin===true,expert:r.expert===true,gossip:r.gossip===true,noAuto:r.noAuto===true,...patch};
  return run(()=>setDoc(doc(db,'roles',id),next),msg).then(ok=>{
    if(ok&&next.gossip&&r.gossip!==true)notify([id],'role','💎 Вы теперь сплетник!','Алмазная рамка и высший статус Комитета',{tab:'profile'});
    else if(ok&&(next.expert||next.gossip)&&!(r.expert===true||r.gossip===true))notify([id],'role','🎉 Вы теперь знаток!','Открыты чаты знатоков, а ваши оценки весят больше',{tab:'profile'});
    return ok;});
}

async function sendMsg(payload,blob){
  const cid=S.chatId;if(!cid)return false;
  const mref=doc(collection(db,'chats',cid,'msgs'));const at=Date.now();
  const bt=writeBatch(db);
  let extra={};
  if(blob){
    const n=Math.max(1,Math.ceil(blob.bytes.length/CHUNK));if(n>4){toast('Файл слишком большой');return false;}
    for(let i=0;i<n;i++)bt.set(doc(db,'chats',cid,'blobs',mref.id+'-'+pad3(i)),{d:Bytes.fromUint8Array(blob.bytes.subarray(i*CHUNK,(i+1)*CHUNK))});
    extra={n,mime:String(blob.mime).slice(0,60)};
  }
  bt.set(mref,{by:S.me.id,at,...payload,...extra});
  const prev={text:'',img:'',voice:'',sticker:'',post:(payload.post&&payload.post.title)||''}[payload.kind];
  bt.update(doc(db,'chats',cid),{lastAt:at,last:{by:S.me.id,kind:payload.kind,text:String(payload.kind==='text'?payload.text:prev||'').slice(0,80)}});
  S.forceBottom=true;
  const ok=await run(()=>bt.commit());
  if(ok){const c=S.chats[cid]||{};const txt={text:payload.text,img:'📷 Фото',voice:'🎤 Голосовое',sticker:(STK[payload.sticker]&&(STK[payload.sticker].e||STK[payload.sticker].t.replace(/\n/g,' ')))||'Стикер',post:'↗ Завоз: '+((payload.post&&payload.post.title)||'')}[payload.kind]||'';
    notify((c.members||[]),'chat',c.title||'Чат',`${realName(S.me.id)}: ${String(txt).slice(0,200)}`,{cid},false);}
  return ok;
}
const blobUrlCache=new Map();
async function fetchChatBlob(cid,m){
  const key=cid+'/'+m.id;if(blobUrlCache.has(key))return blobUrlCache.get(key);
  const n=Math.max(1,Math.min(4,m.n|0));const parts=[];
  for(let i=0;i<n;i++){const s=await getDoc(doc(db,'chats',cid,'blobs',m.id+'-'+pad3(i)));if(!s.exists())throw new Error('missing');parts.push(s.data().d.toUint8Array());}
  const url=URL.createObjectURL(new Blob(parts,{type:(m.mime||'application/octet-stream').split(';')[0]}));
  blobUrlCache.set(key,url);return url;
}

let REC=null;
async function startRec(){
  if(REC)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Этот браузер не умеет записывать голос');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Нет доступа к микрофону — разрешите его в настройках браузера');return;}
  const types=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  let mr;try{mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:48000}:{audioBitsPerSecond:48000});}catch(e){mr=new MediaRecorder(stream);}
  const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  let ac=null,an=null,buf=null;
  try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();const src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=1024;src.connect(an);buf=new Uint8Array(an.fftSize);}catch(e){}
  REC={mr,stream,chunks,ac,an,buf,levels:[],t0:Date.now(),mime:mr.mimeType||mime||'audio/mp4',timer:null};
  $('#recBar').classList.remove('hidden');$('#cRow').classList.add('hidden');$('#stkPanel').classList.add('hidden');S.stkOpen=false;
  REC.timer=setInterval(()=>{
    const R=REC;if(!R)return;
    let lv=0.15;if(R.an){R.an.getByteTimeDomainData(R.buf);let s=0;for(let i=0;i<R.buf.length;i++){const x=(R.buf[i]-128)/128;s+=x*x;}lv=Math.sqrt(s/R.buf.length);}
    R.levels.push(lv);
    const sec=(Date.now()-R.t0)/1000;const t=$('#recTime');if(t)t.textContent=fmtDur(sec);
    const w=$('#recWave');if(w){const last=R.levels.slice(-28);w.innerHTML=last.map(v=>`<i style="height:${Math.max(10,Math.min(100,v*400))}%"></i>`).join('');}
    if(sec>=MAX_VOICE)stopRec(true);
  },100);
  mr.start(250);
}
function cancelRec(){if(REC)stopRec(false);}
function stopRec(send){
  const R=REC;if(!R)return;REC=null;clearInterval(R.timer);
  const rb=$('#recBar'),cr=$('#cRow');if(rb)rb.classList.add('hidden');if(cr)cr.classList.remove('hidden');
  R.mr.onstop=async()=>{
    R.stream.getTracks().forEach(t=>t.stop());try{R.ac&&R.ac.close();}catch(e){}
    if(!send)return;
    const dur=(Date.now()-R.t0)/1000;if(dur<0.8){toast('Слишком короткое сообщение');return;}
    const blob=new Blob(R.chunks,{type:R.mime.split(';')[0]});
    const bytes=new Uint8Array(await blob.arrayBuffer());
    const L=R.levels;const N=40;const wave=[];
    const mx=Math.max(0.02,...L);
    for(let i=0;i<N;i++){const a=Math.floor(i*L.length/N),b=Math.max(a+1,Math.floor((i+1)*L.length/N));let s=0,k=0;for(let j=a;j<b&&j<L.length;j++){s+=L[j];k++;}wave.push(Math.round(Math.max(.08,Math.min(1,(k?s/k:0)/mx))*100));}
    await sendMsg({kind:'voice',dur:Math.round(dur),wave},{bytes,mime:R.mime.split(';')[0]});
  };
  try{R.mr.stop();}catch(e){R.stream.getTracks().forEach(t=>t.stop());}
}
let curAudio=null;
function setVProg(mid,f){const e=document.querySelector(`[data-vid="${CSS.escape(mid)}"]`);if(!e)return;const bs=e.querySelectorAll('.wave i');bs.forEach((b,i)=>b.classList.toggle('on',(i+.5)/bs.length<=f));}
function stopVoice(){if(curAudio){try{curAudio.a.pause();}catch(e){}const el=document.querySelector(`[data-vid="${CSS.escape(curAudio.mid)}"]`);if(el){el.classList.remove('playing');setVProg(curAudio.mid,0);}curAudio=null;}}
async function playVoice(mid){
  if(curAudio&&curAudio.mid===mid){const a=curAudio.a;if(a.paused){a.play().catch(()=>{});setVEl(mid,true);}else{a.pause();setVEl(mid,false);}return;}
  stopVoice();
  const m=S.msgs.find(x=>x.id===mid);if(!m)return;
  const el=document.querySelector(`[data-vid="${CSS.escape(mid)}"]`);if(el)el.classList.add('loading');
  try{
    const url=await fetchChatBlob(S.chatId,m);
    const a=new Audio(url);curAudio={mid,a};
    a.ontimeupdate=()=>{const d=(a.duration&&isFinite(a.duration))?a.duration:(m.dur||1);setVProg(mid,a.currentTime/d);};
    a.onended=()=>{stopVoice();};
    await a.play();setVEl(mid,true);
  }catch(e){console.error(e);toast('Не удалось воспроизвести — формат может не поддерживаться этим браузером');stopVoice();}
  finally{const e2=document.querySelector(`[data-vid="${CSS.escape(mid)}"]`);if(e2)e2.classList.remove('loading');}
}
function setVEl(mid,on){const e=document.querySelector(`[data-vid="${CSS.escape(mid)}"]`);if(e)e.classList.toggle('playing',on);}

    const arr=[];s.forEach(d=>arr.push({...d.data(),id:d.id}));S.notifs=arr;

      s.docChanges().filter(c=>c.type==='added').forEach(c=>{const n=c.doc.data();try{new Notification(n.title||'Комитет Завозов',{body:n.body||'',icon:(document.querySelector('link[rel=icon]')||{}).href,tag:c.doc.id});}catch(e){}});
    }
    notifFirst=false;renderBell();if($('#ntList'))$('#ntList').innerHTML=notifListHtml();
  },e=>console.error(e));
}
function stopNotifs(){if(notifUnsub)notifUnsub();notifUnsub=null;S.notifs=[];}
const unreadNotifs=()=>(S.notifs||[]).filter(n=>!n.read).length;
function renderBell(){
  const b=$('#bellBtn');if(!b)return;
  b.style.display=S.user?'':'none';
  const n=unreadNotifs();const d=b.querySelector('.dot');
  if(d){d.textContent=n>99?'99+':n;d.style.display=n?'':'none';}
}
function allUserIds(){return Object.keys(S.names);}
function adminIds(){return Object.keys(S.roles).filter(id=>S.roles[id]&&S.roles[id].admin===true);}
function siteLink(ref){
  const base=location.origin+location.pathname;
  return base+(ref&&ref.pid?'#p-'+ref.pid:ref&&ref.cid?'#c-'+ref.cid:'');
}
function pushNtfy(topic,title,body,ref,type){
  if(!okTopic(topic))return;
  try{fetch(NTFY,{method:'POST',body:JSON.stringify({topic,title:String(title).slice(0,120),message:String(body||title).slice(0,400),click:siteLink(ref),tags:[({post:'newspaper',rate:'star',mine:'white_check_mark',chat:'speech_balloon',role:'tada',mod:'shield'})[type]||'bell']})}).catch(()=>{});}catch(e){}
}
/* type — категория, inApp=false — только пуш (для сообщений чата) */
async function notify(uids,type,title,body,ref,inApp=true){
  if(!S.me.id)return;
  const at=Date.now();
  for(const uid of [...new Set(uids)]){
    if(!uid||uid===S.me.id)continue;
    const u=S.names[uid]||{};const np=(u.np&&typeof u.np==='object')?u.np:{};
    if(inApp){try{await setDoc(doc(collection(db,'notifs',uid,'items')),{type,title:String(title).slice(0,120),body:String(body||'').slice(0,300),at,from:S.me.id,read:false,ref:ref||{}});}catch(e){console.warn(e);}}
    if(np[type]!==false&&okTopic(u.ntfy))pushNtfy(u.ntfy,title,body,ref,type);
  }
}
function notifListHtml(){
  const list=S.notifs||[];
  if(!list.length)return '<div class="legend" style="text-align:center;padding:18px 0">Пока тихо. Здесь появятся оценки ваших завозов, решения модерации и новости Комитета.</div>';
  return list.map(n=>`<button class="nt ${n.read?'':'unread'}" data-nt="${esc(n.id)}">
    <span class="nt-ic">${n.from&&S.names[n.from]?avatarHtml(n.from,36):`<span class="nt-e">${NICON[n.type]||'🔔'}</span>`}<i>${NICON[n.type]||'🔔'}</i></span>
    <span class="nt-mid"><b>${esc(n.title||'')}</b>${n.body?`<span>${esc(n.body)}</span>`:''}<small>${chatTime(+n.at||0)}</small></span>
  </button>`).join('');
}
function openNotifs(){
  openSheet(`<div class="row" style="margin-bottom:6px"><h3 style="padding:0;margin:0">Уведомления</h3>
      <span style="display:flex;gap:6px"><button class="btn ghost" id="ntAll" style="padding:6px 10px">Прочитать все</button><button class="btn" id="ntSet" style="padding:6px 10px">⚙</button></span></div>
    <div class="ntlist" id="ntList">${notifListHtml()}</div>
    <div class="actions" style="justify-content:flex-end"><button class="btn ghost" id="ntClose">Закрыть</button></div>`);
  $('#ntClose').onclick=closeSheet;
  $('#ntSet').onclick=openNotifSettings;
  $('#ntAll').onclick=markAllRead;
  $('#ntList').onclick=async e=>{
    const b=e.target.closest('[data-nt]');if(!b)return;
    const n=(S.notifs||[]).find(x=>x.id===b.dataset.nt);if(!n)return;
    if(!n.read)updateDoc(doc(db,'notifs',S.me.id,'items',n.id),{read:true}).catch(()=>{});
    closeSheet();goRef(n.ref||{});
  };
}
async function markAllRead(){
  const un=(S.notifs||[]).filter(n=>!n.read);if(!un.length)return;
  const bt=writeBatch(db);un.forEach(n=>bt.update(doc(db,'notifs',S.me.id,'items',n.id),{read:true}));
  await run(()=>bt.commit());
}
function goRef(ref){
  if(ref.pid){S.prevTab=S.tab==='post'?'feed':S.tab;S.tab='post';S.postId=ref.pid;S.open.add(ref.pid);render();window.scrollTo(0,0);}
  else if(ref.cid&&canChat()){goChat(ref.cid);}
  else if(ref.tab){S.tab=ref.tab;if(ref.tab==='profile')S.profileId=S.me.id;render();window.scrollTo(0,0);}
}
function openNotifSettings(){
  const u=S.names[S.me.id]||{};const np=(u.np&&typeof u.np==='object')?u.np:{};
  const on=okTopic(u.ntfy);
  const canBrowser='Notification' in window;
  openSheet(`<h3 style="padding:0">Настройки уведомлений</h3>
    <div class="card npush">
      <div class="np-h"><span class="np-ic">📲</span><span><b>Пуши на телефон</b><small>${on?'<span class="ok">● включены</span>':'выключены'}</small></span></div>
      ${on?`
        <ol class="np-steps">
          <li>Установите бесплатное приложение <b>ntfy</b>: <a href="https://apps.apple.com/app/id1625396347" target="_blank" rel="noopener">App Store</a> · <a href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">Google Play</a></li>
          <li>Откройте его, разрешите уведомления, нажмите <b>+</b> и вставьте название вашего канала (сервер оставьте ntfy.sh):
            <div class="np-topic"><code id="npTopic">${esc(u.ntfy)}</code><button class="btn" id="npCopy" style="padding:6px 10px">Копировать</button></div></li>
          <li>Нажмите «Проверить» — на телефон должно прийти уведомление.</li>
        </ol>
        <div class="actions"><button class="btn primary" id="npTest">Проверить</button><button class="btn danger" id="npOff">Выключить</button></div>
        <div class="legend" style="margin:8px 0 0">Название канала — ваш личный ключ, не публикуйте его. Текст уведомлений проходит через сервис ntfy.sh.</div>`
      :`<div class="legend" style="margin:8px 0 10px">Приложение отправляет уведомления через бесплатный сервис ntfy — они приходят, даже когда сайт закрыт.</div>
        <button class="btn primary" id="npOn">Включить пуши</button>`}
    </div>
    <label class="f">Что присылать</label>
    <div class="ulist" id="npTypes">${NTYPES.filter(t=>t[0]!=='mod'||S.me.admin).map(([k,l,ic])=>`<label class="pickrow"><input type="checkbox" data-np="${k}" ${np[k]===false?'':'checked'}><span>${ic}</span><span>${l}</span></label>`).join('')}</div>
    ${canBrowser?`<div class="legend" style="margin:12px 0 0">Уведомления в браузере (пока сайт открыт в фоне): <b>${Notification.permission==='granted'?'разрешены':Notification.permission==='denied'?'запрещены в настройках браузера':'не разрешены'}</b>${Notification.permission==='default'?' <button class="btn ghost" id="npBrowser" style="padding:4px 8px;margin-left:6px">Разрешить</button>':''}</div>`:''}
    <div class="actions" style="justify-content:space-between"><button class="btn ghost" id="npBack">‹ К уведомлениям</button><button class="btn primary" id="npSave">Сохранить</button></div>`);
  const ref=doc(db,'users',S.me.id);
  $('#npBack').onclick=openNotifs;
  if($('#npOn'))$('#npOn').onclick=async()=>{
    const rnd=Array.from(crypto.getRandomValues(new Uint8Array(20)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');
    if(await run(()=>setDoc(ref,{ntfy:'kz-'+rnd},{merge:true}),'Пуши включены — осталось подписаться в ntfy'))setTimeout(openNotifSettings,300);
  };
  if($('#npOff'))$('#npOff').onclick=async()=>{if(await run(()=>setDoc(ref,{ntfy:''},{merge:true}),'Пуши выключены'))setTimeout(openNotifSettings,300);};
  if($('#npCopy'))$('#npCopy').onclick=async()=>{try{await navigator.clipboard.writeText(u.ntfy);toast('Скопировано');}catch(e){toast('Выделите название и скопируйте вручную');}};
  if($('#npTest'))$('#npTest').onclick=()=>{pushNtfy(u.ntfy,'Комитет Завозов','Проверка связи: уведомления работают 🎉',{},'role');toast('Отправлено — проверьте телефон');};
  if($('#npBrowser'))$('#npBrowser').onclick=async()=>{try{await Notification.requestPermission();}catch(e){}openNotifSettings();};
  $('#npSave').onclick=async()=>{
    const m={};document.querySelectorAll('#npTypes [data-np]').forEach(c=>{m[c.dataset.np]=c.checked;});
    if(await run(()=>setDoc(ref,{np:m},{merge:true}),'Сохранено'))openNotifs();
  };
}
/* переходы по ссылке из уведомления: #p-<завоз>, #c-<чат> */
function handleHash(){
  const h=location.hash||'';if(!S.user||!h)return;
  let m;
  if((m=h.match(/^#p-([\w-]+)$/))){if(!S.loaded.posts)return;history.replaceState(null,'',location.pathname);goRef({pid:m[1]});}
  else if((m=h.match(/^#c-([\w-]+)$/))){if(!S.chatsLoaded)return;history.replaceState(null,'',location.pathname);if(S.chats[m[1]])goChat(m[1]);}
}
addEventListener('hashchange',()=>handleHash());

/* ---------- видимая область над клавиатурой (iOS) ---------- */
function syncVV(){
  const vv=window.visualViewport;const hgt=vv?vv.height:innerHeight;const top=vv?vv.offsetTop:0;
  const r=document.documentElement.style;r.setProperty('--vvh',hgt+'px');r.setProperty('--vvt',top+'px');
  if(document.body.classList.contains('inchat')){const box=$('#msgs');if(box&&document.activeElement&&document.activeElement.id==='cText')box.scrollTop=box.scrollHeight;}
}
if(window.visualViewport){visualViewport.addEventListener('resize',syncVV);visualViewport.addEventListener('scroll',syncVV);}
addEventListener('resize',syncVV);syncVV();
document.addEventListener('focusin',e=>{const t=e.target;if(!t||!/^(INPUT|TEXTAREA)$/.test(t.tagName))return;if(t.id==='cText'){const sb=()=>{const b=$('#msgs');if(b)b.scrollTop=b.scrollHeight;};setTimeout(sb,150);setTimeout(sb,450);return;}if(t.closest('.sheet .box'))setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'});}catch(x){}},300);});

/* ---------- WebGL-фон ---------- */
function startGL(){
  const c=document.querySelector('#bg');let gl;
  try{gl=c.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'});}catch(e){}
  if(!gl)return;
  const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs=`precision mediump float;uniform vec2 r;uniform float t;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+1.),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
  void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv*vec2(r.x/r.y,1.)*1.6;
    float q=fbm(p+vec2(t*.02,t*.015));float w=fbm(p+q*2.2+vec2(t*.04,-t*.03));
    vec3 c=vec3(.965,.945,.902);
    c=mix(c,vec3(.93,.84,.64),smoothstep(.52,.95,w)*.55);
    c=mix(c,vec3(.99,.975,.94),smoothstep(.45,.9,q)*.5);
    c=mix(c,vec3(.84,.67,.33),pow(smoothstep(.74,1.,w),3.)*.35);
    c*=.97+.04*uv.y;
    c+=(h(gl_FragCoord.xy+fract(t))-.5)*.012;
    gl_FragColor=vec4(c,1.);}`;
  const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return gl.getShaderParameter(s,gl.COMPILE_STATUS)?s:null;};
  const v=sh(gl.VERTEX_SHADER,vs),f=sh(gl.FRAGMENT_SHADER,fs);if(!v||!f)return;
  const pr=gl.createProgram();gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;
  gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uR=gl.getUniformLocation(pr,'r'),uT=gl.getUniformLocation(pr,'t');
  const scale=.5;
  function size(){const w=Math.max(1,Math.floor(innerWidth*scale)),hh=Math.max(1,Math.floor(innerHeight*scale));if(c.width!==w||c.height!==hh){c.width=w;c.height=hh;gl.viewport(0,0,w,hh);}}
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last=0;const t0=performance.now();
  function frame(now){
    if(document.hidden){requestAnimationFrame(frame);return;}
    if(now-last>=33){last=now;size();gl.uniform2f(uR,c.width,c.height);gl.uniform1f(uT,(now-t0)/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
    if(!reduce)requestAnimationFrame(frame);
  }
  addEventListener('resize',()=>{if(reduce)requestAnimationFrame(frame);});
  requestAnimationFrame(frame);
}

/* ---------- запуск ---------- */
render();startGL();
if(configured){
  onAuthStateChanged(auth,async u=>{
    stopAll();
    S.user=u;S.authReady=true;
    S.me={id:u?u.uid:null,admin:false,expert:false,gossip:false};S.rolesLoaded=false;S.authorsLoaded=false;S.chatsLoaded=false;S.chats={};
    S.okPosts={};S.adminPosts={};S.myPosts={};S.myIds=new Set();S.authors={};S.ratings={};S.roles={};S.names={};
    S.loaded={posts:false,ratings:false};S.notice='';S.tab='feed';
    render();
    if(!u)return;
    try{
      const ref=doc(db,'users',u.uid);
      const snap=await getDoc(ref);
      const want=S.pendingName||(snap.exists()&&snap.data().name)||u.displayName||(u.email||'').split('@')[0]||'Участник';
      S.pendingName=null;
      const cur=snap.exists()?snap.data():{};
      if(!snap.exists()||cur.name!==want||!cur.since)await setDoc(ref,{name:want.slice(0,40),nameLower:want.slice(0,40).toLowerCase(),...(cur.since?{}:{since:Date.now()})},{merge:true});
    }catch(e){console.error(e);}
    startData();
  });
}
